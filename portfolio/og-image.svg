    <line x1="600" y1="0" x2="600" y2="630" stroke="#58ebe0" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#58ebe0" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#58ebe0" stroke-width="1"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#58ebe0" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#58ebe0" stroke-width="1"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#58ebe0" stroke-width="1"/>
  </g>
  <!-- Brand mark -->
  <rect x="80" y="80" width="64" height="58" fill="#58ebe0" rx="2" transform="skewX(-8)"/>
