  <text x="80" y="355" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#58ebe0" letter-spacing="2">NEXT SYSTEM</text>
  <!-- Description -->
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="20" fill="#8ca2a7">Cybersecurity | AI/ML Engineer | Full-Stack Developer</text>
  <text x="80" y="452" font-family="Arial, sans-serif" font-size="16" fill="#5e7a7c">30+ Projects | 15+ Awards | Open to Opportunities</text>
