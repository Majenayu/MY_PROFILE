  <rect x="0" y="626" width="1200" height="4" fill="#58ebe0"/>
  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="200" y1="0" x2="200" y2="630" stroke="#58ebe0" stroke-width="1"/>
