<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Profile Editor — Ayush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;}
body{min-height:100vh;background:#060a10;font-family:'Syne',sans-serif;color:#e8eaf0;overflow-x:hidden;}
:root{
  --bg:#060a10;--card:#0c1525;--surface:#0f1d30;--surface2:#111f33;
  --border:rgba(0,240,255,0.13);--accent:#00f0ff;--accent2:#7c3aed;
  --danger:#f87171;--success:#4ade80;--text:#e8eaf0;--muted:#4f6080;
  --mono:'Space Mono',monospace;--display:'Bebas Neue',sans-serif;
}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");opacity:.45;}
.blob{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;}
.b1{width:400px;height:400px;top:-100px;left:-80px;background:radial-gradient(circle,rgba(0,240,255,0.08),transparent 70%);animation:d1 20s ease-in-out infinite;}
.b2{width:300px;height:300px;bottom:0;right:0;background:radial-gradient(circle,rgba(124,58,237,0.08),transparent 70%);animation:d2 25s ease-in-out infinite;}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,40px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-25px,-30px)}}

.page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:36px 24px 60px;}

/* HEADER */
.header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px;gap:16px;flex-wrap:wrap;}
.page-title{font-family:var(--display);font-size:3rem;letter-spacing:.05em;line-height:1;background:linear-gradient(130deg,#fff 20%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.page-sub{font-family:var(--mono);font-size:.55rem;color:var(--muted);letter-spacing:.12em;margin-top:4px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--muted);padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);transition:color .2s,border-color .2s;flex-shrink:0;}
.back-btn:hover{color:var(--accent);border-color:rgba(0,240,255,.3);}

/* FORM CARD */
.form-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:30px;box-shadow:0 8px 40px rgba(0,0,0,.4);max-width:700px;margin:0 auto;}
.form-card::before{content:'';display:block;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;margin-bottom:26px;}

/* SECTIONS */
.section{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border);}
.section:last-child{border-bottom:none;margin-bottom:0;}
.section-title{font-family:var(--mono);font-size:.65rem;letter-spacing:.18em;color:var(--accent);opacity:.8;margin-bottom:18px;text-transform:uppercase;}

/* FIELDS */
.field{margin-bottom:16px;}
.field label{display:block;font-family:var(--mono);font-size:.54rem;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-family:'Syne',sans-serif;font-size:.85rem;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;resize:none;}
.field textarea{height:80px;line-height:1.5;}
.field input:focus,.field textarea:focus{border-color:rgba(0,240,255,.4);box-shadow:0 0 0 3px rgba(0,240,255,.07);}
.field input.err{border-color:rgba(248,113,113,.5);}

/* TWO COLUMN LAYOUT */
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.field-row{grid-template-columns:1fr;}}

/* CHARACTER IMAGE UPLOAD */
.char-upload{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;}
.char-preview{width:80px;height:80px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--surface2);}
.char-preview img{width:100%;height:100%;object-fit:cover;}
.char-upload-info{flex:1;}
.char-upload-label{font-family:var(--mono);font-size:.54rem;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.char-upload-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:var(--mono);font-size:.6rem;cursor:pointer;transition:border-color .2s,background .2s;}
.char-upload-btn:hover{border-color:var(--accent);background:rgba(0,240,255,.05);}
.char-upload-btn input{display:none;}

/* STATUS CHIPS */
.status-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.status-chip{font-family:var(--mono);font-size:.54rem;letter-spacing:.05em;padding:6px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .2s;}
.status-chip.active{color:var(--success);border-color:rgba(74,222,128,.3);background:rgba(74,222,128,.08);}
.status-chip:hover{border-color:var(--accent);}

/* SUBMIT BUTTONS */
.button-row{display:flex;gap:12px;margin-top:32px;}
.submit-btn{flex:1;padding:12px;border-radius:10px;border:none;cursor:pointer;font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.12em;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;transition:opacity .2s,transform .2s;box-shadow:0 4px 20px rgba(0,240,255,.2);position:relative;overflow:hidden;}
.submit-btn:hover:not(:disabled){opacity:.88;transform:translateY(-1px);}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;}
.submit-btn .btn-loader{display:none;width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto;}
.submit-btn.loading .btn-text{display:none;}
.submit-btn.loading .btn-loader{display:block;}

.cancel-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-family:var(--mono);font-size:.7rem;font-weight:400;letter-spacing:.1em;background:var(--surface);color:var(--muted);transition:border-color .2s,color .2s;}
.cancel-btn:hover{border-color:rgba(248,113,113,.3);color:var(--danger);}

@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(16px);font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;padding:9px 18px;border-radius:10px;z-index:200;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;}
.toast.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:var(--success);}
.toast.err{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--danger);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="page">
  <div class="header">
    <div>
      <div class="page-title">Profile Editor</div>
      <div class="page-sub">Customize your profile information</div>
    </div>
    <a href="/" class="back-btn">← Back to Profile</a>
  </div>

  <div class="form-card">
    
    <!-- BASIC INFO -->
    <div class="section">
      <div class="section-title">Basic Information</div>
      
      <div class="field">
        <label>Full Name *</label>
        <input type="text" id="fullName" placeholder="P G AYUSH RAI" maxlength="60"/>
      </div>
      
      <div class="field">
        <label>Professional Title</label>
        <input type="text" id="title" placeholder="B.Tech · Developer · Builder" maxlength="80"/>
      </div>
      
      <div class="field">
        <label>About Description *</label>
        <textarea id="description" placeholder="Tell people about yourself, your passion, and what drives you..."></textarea>
      </div>
    </div>

    <!-- CHARACTER & AVATAR -->
    <div class="section">
      <div class="section-title">Character Avatar</div>
      
      <div class="char-upload">
        <div class="char-preview" id="charPreview">
          <img id="charImg" src="https://storage.googleapis.com/anirive-outputs/users/HN9YKn8OyMfDhEb7ofw1ho2mzGQ2/chars/mmnd4h8r/anims/mmnd8v9a/animation.webp" alt="Character"/>
        </div>
        <div class="char-upload-info">
          <div class="char-upload-label">Character Image</div>
          <label class="char-upload-btn">
            <span>📁 Choose Image</span>
            <input type="file" id="charFile" accept="image/*"/>
          </label>
          <div style="font-size:.5rem;color:var(--muted);margin-top:6px;">Animated GIFs and WebP supported</div>
        </div>
      </div>
    </div>

    <!-- STATUS & LOCATION -->
    <div class="section">
      <div class="section-title">Status & Location</div>
      
      <div class="field-row">
        <div class="field">
          <label>Location</label>
          <input type="text" id="location" placeholder="India" maxlength="40"/>
        </div>
        
        <div class="field">
          <label>Education/Degree</label>
          <input type="text" id="education" placeholder="B.Tech" maxlength="40"/>
        </div>
      </div>
      
      <div class="field">
        <label>Availability Status</label>
        <div class="status-chips">
          <div class="status-chip active" data-status="open">● Open to Opportunities</div>
          <div class="status-chip" data-status="busy">⚡ Currently Busy</div>
          <div class="status-chip" data-status="available">✓ Available for Projects</div>
          <div class="status-chip" data-status="learning">📚 Learning & Growing</div>
        </div>
      </div>
    </div>

    <!-- SUBMIT BUTTONS -->
    <div class="button-row">
      <button class="cancel-btn" onclick="window.location.href='/'">Cancel</button>
      <button class="submit-btn" id="saveBtn">
        <span class="btn-text">💾 Save Profile</span>
        <div class="btn-loader"></div>
      </button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let selectedStatus = 'open';
let charImageFile = null;

// Load existing profile data
async function loadProfile() {
  try {
    const response = await fetch('/api/profile');
    const data = await response.json();
    
    if (data.success && data.profile) {
      const profile = data.profile;
      
      // Fill form with existing data
      document.getElementById('fullName').value = profile.fullName || 'P G AYUSH RAI';
      document.getElementById('title').value = profile.title || 'B.Tech · Developer · Builder';
      document.getElementById('description').value = profile.description || '';
      document.getElementById('location').value = profile.location || 'India';
      document.getElementById('education').value = profile.education || 'B.Tech';
      
      // Set status
      if (profile.status) {
        selectedStatus = profile.status;
        document.querySelectorAll('.status-chip').forEach(chip => {
          chip.classList.remove('active');
          if (chip.dataset.status === profile.status) {
            chip.classList.add('active');
          }
        });
      }
      
      // Set character image
      if (profile.characterImage) {
        document.getElementById('charImg').src = profile.characterImage;
      }
    }
  } catch (error) {
    console.log('No existing profile data, using defaults');
  }
}

// Status chip selection
document.querySelectorAll('.status-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.status-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedStatus = chip.dataset.status;
  });
});

// Character image upload
document.getElementById('charFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) {
    charImageFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      document.getElementById('charImg').src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
});

// Save profile
document.getElementById('saveBtn').addEventListener('click', async () => {
  const fullName = document.getElementById('fullName').value.trim();
  const description = document.getElementById('description').value.trim();
  
  if (!fullName) {
    showToast('Full name is required', 'err');
    document.getElementById('fullName').focus();
    return;
  }
  
  if (!description) {
    showToast('Description is required', 'err');
    document.getElementById('description').focus();
    return;
  }
  
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.classList.add('loading');
  saveBtn.disabled = true;
  
  const formData = new FormData();
  formData.append('fullName', fullName);
  formData.append('title', document.getElementById('title').value.trim());
  formData.append('description', description);
  formData.append('location', document.getElementById('location').value.trim());
  formData.append('education', document.getElementById('education').value.trim());
  formData.append('status', selectedStatus);
  
  if (charImageFile) {
    formData.append('characterImage', charImageFile);
  }
  
  try {
    const response = await fetch('/api/profile', {
      method: 'POST',
      body: formData
    });
    
    const result = await response.json();
    
    if (result.success) {
      showToast('✓ Profile saved successfully!', 'ok');
      setTimeout(() => {
        window.location.href = '/';
      }, 1500);
    } else {
      showToast(result.error || 'Failed to save profile', 'err');
    }
  } catch (error) {
    showToast('Network error occurred', 'err');
  }
  
  saveBtn.classList.remove('loading');
  saveBtn.disabled = false;
});

// Toast notification
function showToast(message, type = 'ok') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast ${type}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// Load profile data on page load
loadProfile();
</script>
</body>
</html>
